<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atrapa el Objetivo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1e3a8a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .game-container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .description {
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .stat {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
        }

        .game {
            position: relative;
            width: 100%;
            height: 500px;
            background: #0f172a;
            border: 3px solid #3b82f6;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        #target {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #ef4444;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
            transition: transform 0.1s;
        }

        #target:hover {
            transform: scale(1.1);
        }

        button {
            margin-top: 20px;
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            background: #3b82f6;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        #message {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            pointer-events: none;
        }

        .hit {
            animation: hit 0.15s;
        }

        @keyframes hit {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.4);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="game-container">

        <h1>🎯 Atrapa el Objetivo</h1>

        <p class="description">
            Haz clic en el círculo rojo tantas veces como puedas.
        </p>

        <div class="stats">

            <div class="stat">
                🎯 Puntos:
                <span id="score">0</span>
            </div>

            <div class="stat">
                ⏱️ Tiempo:
                <span id="time">30</span>s
            </div>

        </div>

        <div class="game" id="game">

            <div id="message">
                Presiona "Comenzar"
            </div>

            <div id="target"></div>

        </div>

        <button id="startButton">
            🚀 Comenzar juego
        </button>

    </div>

    <script>

        const game = document.getElementById("game");
        const target = document.getElementById("target");
        const scoreElement = document.getElementById("score");
        const timeElement = document.getElementById("time");
        const startButton = document.getElementById("startButton");
        const message = document.getElementById("message");

        let score = 0;
        let time = 30;
        let gameRunning = false;
        let timer;

        startButton.addEventListener("click", startGame);

        target.addEventListener("click", hitTarget);

        function startGame() {

            score = 0;
            time = 30;
            gameRunning = true;

            scoreElement.textContent = score;
            timeElement.textContent = time;

            message.style.display = "none";
            target.style.display = "block";

            startButton.textContent = "🔄 Reiniciar";

            moveTarget();

            clearInterval(timer);

            timer = setInterval(() => {

                time--;

                timeElement.textContent = time;

                if (time <= 0) {
                    endGame();
                }

            }, 1000);
        }

        function hitTarget(event) {

            if (!gameRunning) {
                return;
            }

            event.stopPropagation();

            score++;

            scoreElement.textContent = score;

            target.classList.remove("hit");

            void target.offsetWidth;

            target.classList.add("hit");

            moveTarget();
        }

        function moveTarget() {

            const gameWidth = game.clientWidth;
            const gameHeight = game.clientHeight;

            const targetSize = target.offsetWidth;

            const maxX = gameWidth - targetSize;
            const maxY = gameHeight - targetSize;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            target.style.left = randomX + "px";
            target.style.top = randomY + "px";
        }

        function endGame() {

            gameRunning = false;

            clearInterval(timer);

            target.style.display = "none";

            message.innerHTML = `
                🏆 ¡Juego terminado!<br>
                <span style="font-size: 22px;">
                    Conseguistes ${score} puntos
                </span>
            `;

            message.style.display = "flex";

            startButton.textContent = "🎮 Jugar nuevamente";
        }

    </script>

</body>
</html>
